[project]
name = "cnc-mc-agent"
version = "0.1.0"
description = "Autonomous Closed-Loop CNC Machine Code (G-Code) Generation & Verification Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.0.0",
    "numpy>=1.24.0",
    "ezdxf>=1.4.0",
    "trimesh>=4.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.4.11",
]

[project.scripts]
cnc-mc-agent = "run_pipeline:main"
cnc-agent = "run_pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
